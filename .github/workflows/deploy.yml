name: Deploy Web & App

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write
  checks: write

jobs:
  # 1. 공통 비즈니스 로직 단위 테스트 검증
  test-shared:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Run Shared Unit Tests
        run: ./gradlew :shared:testAndroidHostTest --tests "com.dahee.blockbyblock.SharedLogicAndroidHostTest"

  # 2. 웹 배포 (Firebase Hosting)
  deploy-web:
    name: Build & Deploy Web (Firebase)
    needs: test-shared
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Wasm Web Distribution
        run: ./gradlew :webApp:wasmJsBrowserDistribution

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BLOCKBYBLOCK_WEB || secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: blockbyblock-web

  # 3. 안드로이드 APK 빌드 및 다운로드 아티팩트 등록
  build-android:
    name: Build Android APK
    needs: test-shared
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Android Debug APK
        run: ./gradlew :androidApp:assembleDebug

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BlockByBlock-Android-Debug
          path: androidApp/build/outputs/apk/debug/*.apk
          retention-days: 14
