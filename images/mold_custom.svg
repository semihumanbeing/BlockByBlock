<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <filter id="moldShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.18"/>
    </filter>
  </defs>
  <g filter="url(#moldShadow)" fill="currentColor">
    <!-- Outer Silicone Body -->
    <rect x="50" y="60" width="412" height="392" rx="36"/>
    <rect x="64" y="74" width="384" height="364" rx="26" fill="none" stroke="#E2E8F0" stroke-width="4" opacity="0.8"/>
    <!-- Center modular dashed grid -->
    <rect x="84" y="94" width="344" height="324" rx="20" fill="#000000" opacity="0.2"/>
    <rect x="90" y="100" width="332" height="312" rx="16" fill="currentColor" opacity="0.85"/>
    <!-- Dashed partition line -->
    <line x1="256" y1="100" x2="256" y2="412" stroke="#E2E8F0" stroke-width="4" stroke-dasharray="8 6" opacity="0.8"/>
    <line x1="90" y1="256" x2="422" y2="256" stroke="#E2E8F0" stroke-width="4" stroke-dasharray="8 6" opacity="0.8"/>
    <!-- Custom Plus Icon in Center -->
    <circle cx="256" cy="256" r="32" fill="#FFFFFF" opacity="0.9"/>
    <path d="M 256 238 L 256 274 M 238 256 L 274 256" stroke="currentColor" stroke-width="6" stroke-linecap="round"/>
  </g>
</svg>