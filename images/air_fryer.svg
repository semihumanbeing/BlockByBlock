<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <filter id="af3dShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000000" flood-opacity="0.18"/>
    </filter>
  </defs>
  <g filter="url(#af3dShadow)">
    <!-- Base Drop Shadow -->
    <polygon points="100,420 280,470 430,410 250,360" fill="#000000" opacity="0.25"/>

    <!-- Bottom Base Plate (Dark Slate 3D block) -->
    <polygon points="120,380 280,430 280,450 120,400" fill="#1E293B"/>
    <polygon points="280,430 390,385 390,405 280,450" fill="#0F172A"/>
    <line x1="120" y1="400" x2="280" y2="450" stroke="#334155" stroke-width="2"/>
    <line x1="280" y1="450" x2="390" y2="405" stroke="#1E293B" stroke-width="2"/>

    <!-- Main Lower Body (3D Teal/Mint Housing - 45-degree angle) -->
    <!-- Front Face -->
    <polygon points="120,190 280,240 280,430 120,380" fill="#14B8A6" stroke="#0F766E" stroke-width="3"/>
    <!-- Right Side Face -->
    <polygon points="280,240 390,195 390,385 280,430" fill="#0D9488" stroke="#0F766E" stroke-width="3"/>

    <!-- Pull-Out Basket Drawer (45-degree Recessed Front Face) -->
    <polygon points="140,220 270,260 270,395 140,355" fill="#0F766E"/>
    <polygon points="144,224 266,262 266,391 144,353" fill="#14B8A6"/>

    <!-- Glass Window on Drawer (Angled 3D viewing window, NO chicken, warm amber glow) -->
    <polygon points="158,244 252,274 252,344 158,314" fill="#0F172A" stroke="#334155" stroke-width="3"/>
    <!-- Interior Warm Amber/Orange Glow -->
    <polygon points="162,248 248,276 248,340 162,312" fill="#B45309" fill-opacity="0.9"/>
    <polygon points="166,252 244,278 244,305 166,280" fill="#FB923C" fill-opacity="0.8"/>
    <!-- Clean Grill Mesh Line inside -->
    <line x1="166" y1="316" x2="244" y2="342" stroke="#FED7AA" stroke-width="3" opacity="0.7"/>

    <!-- Window 3D Reflection Glare -->
    <polygon points="170,310 195,258 205,261 180,313" fill="#FFFFFF" opacity="0.35"/>
    <polygon points="220,326 235,271 242,273 227,328" fill="#FFFFFF" opacity="0.35"/>

    <!-- 3D Chunky Handle (Protruding outward in 45-degree angle) -->
    <polygon points="190,335 220,345 220,360 190,350" fill="#0F172A"/>
    <polygon points="185,345 215,355 215,400 185,390" fill="#E2E8F0" stroke="#94A3B8" stroke-width="3"/>
    <polygon points="215,355 225,350 225,395 215,400" fill="#94A3B8"/>
    <line x1="185" y1="345" x2="185" y2="390" stroke="#FFFFFF" stroke-width="2"/>

    <!-- Middle Division Band (White Block Plate in 3D) -->
    <polygon points="116,180 280,230 280,240 116,190" fill="#E2E8F0" stroke="#94A3B8" stroke-width="2"/>
    <polygon points="280,230 394,185 394,195 280,240" fill="#94A3B8" stroke="#64748B" stroke-width="2"/>
    <line x1="116" y1="180" x2="280" y2="230" stroke="#FFFFFF" stroke-width="2"/>
    <line x1="280" y1="230" x2="394" y2="185" stroke="#FFFFFF" stroke-width="2"/>

    <!-- Upper Control Housing (3D angled White/Mint Block Bricks) -->
    <polygon points="120,100 280,150 280,230 120,180" fill="#E2E8F0" stroke="#94A3B8" stroke-width="3"/>
    <polygon points="280,150 390,105 390,185 280,230" fill="#94A3B8" stroke="#64748B" stroke-width="3"/>

    <!-- Front Control Panel (Black Screen in 3D perspective) -->
    <polygon points="136,115 264,155 264,215 136,175" fill="#1E293B" stroke="#0F172A" stroke-width="2"/>
    <polygon points="146,126 200,143 200,168 146,151" fill="#020617"/>
    <!-- LED Studs -->
    <ellipse cx="165" cy="175" rx="8" ry="4" fill="#22C55E" stroke="#15803D" stroke-width="1.5"/>
    <ellipse cx="189" cy="183" rx="8" ry="4" fill="#EF4444" stroke="#B91C1C" stroke-width="1.5"/>

    <!-- 3D Rotary Knob Dial -->
    <ellipse cx="235" cy="166" rx="19" ry="19" fill="#0F172A"/>
    <ellipse cx="233" cy="162" rx="18" ry="18" fill="#E2E8F0" stroke="#94A3B8" stroke-width="2"/>
    <ellipse cx="233" cy="162" rx="7" ry="7" fill="#1E293B"/>
    <line x1="233" y1="162" x2="233" y2="150" stroke="#EF4444" stroke-width="3" stroke-linecap="round"/>

    <!-- Top Surface (45-degree angle Parallelogram) -->
    <polygon points="120,100 230,55 390,105 280,150" fill="#2DD4BF" stroke="#14B8A6" stroke-width="2"/>
    <line x1="120" y1="100" x2="230" y2="55" stroke="#99F6E4" stroke-width="2"/>
    <line x1="230" y1="55" x2="390" y2="105" stroke="#99F6E4" stroke-width="2"/>

    <!-- 4 3D Cylindrical Block Studs on Top -->
    <!-- Stud 1 -->
    <g transform="translate(190, 90)">
      <polygon points="-14,0 14,0 14,8 -14,8" fill="#0D9488"/>
      <ellipse cx="0" cy="8" rx="14" ry="4" fill="#0D9488"/>
      <ellipse cx="0" cy="0" rx="14" ry="4" fill="#2DD4BF" stroke="#99F6E4" stroke-width="1"/>
    </g>
    <!-- Stud 2 -->
    <g transform="translate(255, 110)">
      <polygon points="-14,0 14,0 14,8 -14,8" fill="#0D9488"/>
      <ellipse cx="0" cy="8" rx="14" ry="4" fill="#0D9488"/>
      <ellipse cx="0" cy="0" rx="14" ry="4" fill="#2DD4BF" stroke="#99F6E4" stroke-width="1"/>
    </g>
    <!-- Stud 3 -->
    <g transform="translate(255, 75)">
      <polygon points="-14,0 14,0 14,8 -14,8" fill="#0D9488"/>
      <ellipse cx="0" cy="8" rx="14" ry="4" fill="#0D9488"/>
      <ellipse cx="0" cy="0" rx="14" ry="4" fill="#2DD4BF" stroke="#99F6E4" stroke-width="1"/>
    </g>
    <!-- Stud 4 -->
    <g transform="translate(320, 95)">
      <polygon points="-14,0 14,0 14,8 -14,8" fill="#0D9488"/>
      <ellipse cx="0" cy="8" rx="14" ry="4" fill="#0D9488"/>
      <ellipse cx="0" cy="0" rx="14" ry="4" fill="#2DD4BF" stroke="#99F6E4" stroke-width="1"/>
    </g>
  </g>
</svg>