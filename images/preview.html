<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BlockByBlock - 주방 도구 및 몰드 선택 데모</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      background-color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    .duo-card {
      transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1);
      user-select: none;
    }
    .duo-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 16px -4px rgba(0,0,0,0.08);
    }
    .duo-card:active {
      transform: translateY(3px);
      border-bottom-width: 2px !important;
      margin-bottom: 3px;
    }
    .duo-card.selected {
      background-color: #f0fdf4 !important;
      border-color: #22c55e !important;
    }
    .duo-card.selected .card-label {
      color: #15803d !important;
    }
    .color-dot {
      transition: transform 0.15s;
    }
    .color-dot:hover {
      transform: scale(1.18);
    }
    .color-dot.active {
      outline: 3px solid #0f172a;
      outline-offset: 2px;
    }
    .duo-btn {
      box-shadow: 0 5px 0 #15803d;
    }
    .duo-btn:active {
      transform: translateY(4px);
      box-shadow: 0 1px 0 #15803d;
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 py-10">

  <div class="w-full max-w-2xl bg-white rounded-3xl shadow-2xl p-6 sm:p-10 border-2 border-slate-200">
    
    <!-- Header Step Progress -->
    <div class="flex items-center gap-4 mb-6">
      <button class="text-slate-400 hover:text-slate-600 font-black text-xl">✕</button>
      <div class="flex-1 bg-slate-200 h-4 rounded-full overflow-hidden p-0.5">
        <div class="bg-green-500 h-full w-4/5 rounded-full transition-all duration-500"></div>
      </div>
      <div class="flex items-center gap-1 text-rose-500 font-black text-sm">
        <span>❤️</span> 5
      </div>
    </div>

    <!-- Section 1: Souper Cubes Block Style Molds -->
    <div class="mb-8">
      <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2 mb-3">
        <div>
          <span class="text-xs font-black uppercase tracking-wider text-cyan-600 bg-cyan-100 px-3 py-1 rounded-full">MOLDS (SOUPER CUBES)</span>
          <h1 class="text-2xl sm:text-3xl font-black text-slate-800 mt-2">보유 중인 몰드를 선택하세요</h1>
        </div>

        <!-- Dynamic Color Palette Picker -->
        <div class="flex items-center gap-2 bg-slate-100 p-2 rounded-2xl">
          <span class="text-xs font-bold text-slate-500 mr-1">색상 변경:</span>
          <button onclick="changeMoldColor('#06B6D4', this)" class="color-dot active w-6 h-6 rounded-full bg-cyan-500"></button>
          <button onclick="changeMoldColor('#E11D48', this)" class="color-dot w-6 h-6 rounded-full bg-rose-600"></button>
          <button onclick="changeMoldColor('#84CC16', this)" class="color-dot w-6 h-6 rounded-full bg-lime-500"></button>
          <button onclick="changeMoldColor('#F97316', this)" class="color-dot w-6 h-6 rounded-full bg-orange-500"></button>
          <button onclick="changeMoldColor('#8B5CF6', this)" class="color-dot w-6 h-6 rounded-full bg-purple-500"></button>
          <button onclick="changeMoldColor('#3B82F6', this)" class="color-dot w-6 h-6 rounded-full bg-blue-500"></button>
        </div>
      </div>
      <p class="text-sm text-slate-500">위에서 내려다본 수퍼큐브(Souper Cubes) & 블록 스타일 실리콘 냉동 몰드</p>
    </div>

    <!-- Molds Grid (5 Types) -->
    <div class="grid grid-cols-2 sm:grid-cols-3 gap-3.5 mb-10" id="moldCardsGrid">
      
      <!-- 1. 1칸 몰드 -->
      <div onclick="toggleCard(this)" class="duo-card cursor-pointer relative flex flex-col items-center justify-between p-3.5 bg-white rounded-2xl border-2 border-b-[5px] border-slate-200">
        <div class="w-24 h-24 flex items-center justify-center mb-1">
          <img src="./mold_1slot.svg" id="mold_1slot_img" alt="1칸 몰드" class="w-20 h-20 object-contain drop-shadow-sm" style="color: #06B6D4;" />
        </div>
        <span class="card-label font-black text-slate-700 text-sm">1칸 몰드 (2-Cup)</span>
      </div>

      <!-- 2. 4칸 몰드 -->
      <div onclick="toggleCard(this)" class="duo-card selected cursor-pointer relative flex flex-col items-center justify-between p-3.5 bg-green-50 rounded-2xl border-2 border-b-[5px] border-green-500">
        <div class="w-24 h-24 flex items-center justify-center mb-1">
          <img src="./mold_4slot.svg" id="mold_4slot_img" alt="4칸 몰드" class="w-20 h-20 object-contain drop-shadow-sm" style="color: #06B6D4;" />
        </div>
        <span class="card-label font-black text-green-700 text-sm">4칸 몰드 (1-Cup)</span>
      </div>

      <!-- 3. 6칸 몰드 -->
      <div onclick="toggleCard(this)" class="duo-card cursor-pointer relative flex flex-col items-center justify-between p-3.5 bg-white rounded-2xl border-2 border-b-[5px] border-slate-200">
        <div class="w-24 h-24 flex items-center justify-center mb-1">
          <img src="./mold_6slot.svg" id="mold_6slot_img" alt="6칸 몰드" class="w-20 h-20 object-contain drop-shadow-sm" style="color: #06B6D4;" />
        </div>
        <span class="card-label font-black text-slate-700 text-sm">6칸 몰드 (1/2-Cup)</span>
      </div>

      <!-- 4. 얼음틀 (15칸) -->
      <div onclick="toggleCard(this)" class="duo-card cursor-pointer relative flex flex-col items-center justify-between p-3.5 bg-white rounded-2xl border-2 border-b-[5px] border-slate-200">
        <div class="w-24 h-24 flex items-center justify-center mb-1">
          <img src="./mold_15slot.svg" id="mold_15slot_img" alt="얼음틀 (15칸)" class="w-20 h-20 object-contain drop-shadow-sm" style="color: #06B6D4;" />
        </div>
        <span class="card-label font-black text-slate-700 text-sm">얼음틀 (15칸)</span>
      </div>

      <!-- 5. 커스텀 몰드 -->
      <div onclick="toggleCard(this)" class="duo-card col-span-2 sm:col-span-2 cursor-pointer relative flex items-center justify-start gap-4 p-3.5 px-6 bg-white rounded-2xl border-2 border-b-[5px] border-slate-200">
        <div class="w-16 h-16 flex items-center justify-center flex-shrink-0">
          <img src="./mold_custom.svg" id="mold_custom_img" alt="커스텀 몰드" class="w-14 h-14 object-contain drop-shadow-sm" style="color: #06B6D4;" />
        </div>
        <div class="flex flex-col text-left">
          <span class="card-label font-black text-slate-700 text-base">커스텀 몰드</span>
          <span class="text-xs text-slate-400 font-medium">원하는 칸 수와 용량을 자유롭게 설정</span>
        </div>
      </div>

    </div>

    <!-- Section 2: Kitchen Appliances (Toy Block) -->
    <div class="mb-4">
      <span class="text-xs font-black uppercase tracking-wider text-green-600 bg-green-100 px-3 py-1 rounded-full">APPLIANCES</span>
      <h2 class="text-xl font-black text-slate-800 mt-2">사용 가능한 주방 기기</h2>
    </div>

    <div class="grid grid-cols-2 sm:grid-cols-4 gap-3.5 mb-8">
      
      <!-- 에어프라이어 (NEW) -->
      <div onclick="toggleCard(this)" class="duo-card cursor-pointer relative flex flex-col items-center justify-between p-3.5 bg-white rounded-2xl border-2 border-b-[5px] border-slate-200">
        <div class="w-20 h-20 flex items-center justify-center mb-1">
          <img src="./air_fryer.png" alt="에어프라이어" class="w-16 h-16 object-contain" />
        </div>
        <span class="card-label font-black text-slate-700 text-xs sm:text-sm">에어프라이어</span>
      </div>

      <!-- 전자렌지 -->
      <div onclick="toggleCard(this)" class="duo-card cursor-pointer relative flex flex-col items-center justify-between p-3.5 bg-white rounded-2xl border-2 border-b-[5px] border-slate-200">
        <div class="w-20 h-20 flex items-center justify-center mb-1">
          <img src="./microwave.png" alt="전자렌지" class="w-16 h-16 object-contain" />
        </div>
        <span class="card-label font-black text-slate-700 text-xs sm:text-sm">전자렌지</span>
      </div>

      <!-- 오븐 -->
      <div onclick="toggleCard(this)" class="duo-card cursor-pointer relative flex flex-col items-center justify-between p-3.5 bg-white rounded-2xl border-2 border-b-[5px] border-slate-200">
        <div class="w-20 h-20 flex items-center justify-center mb-1">
          <img src="./oven.png" alt="오븐" class="w-16 h-16 object-contain" />
        </div>
        <span class="card-label font-black text-slate-700 text-xs sm:text-sm">오븐</span>
      </div>

      <!-- 가스렌지 -->
      <div onclick="toggleCard(this)" class="duo-card cursor-pointer relative flex flex-col items-center justify-between p-3.5 bg-white rounded-2xl border-2 border-b-[5px] border-slate-200">
        <div class="w-20 h-20 flex items-center justify-center mb-1">
          <img src="./gas_stove.png" alt="가스렌지" class="w-16 h-16 object-contain" />
        </div>
        <span class="card-label font-black text-slate-700 text-xs sm:text-sm">가스렌지</span>
      </div>

      <!-- 슬로우쿠커 -->
      <div onclick="toggleCard(this)" class="duo-card cursor-pointer relative flex flex-col items-center justify-between p-3.5 bg-white rounded-2xl border-2 border-b-[5px] border-slate-200">
        <div class="w-20 h-20 flex items-center justify-center mb-1">
          <img src="./slow_cooker.png" alt="슬로우쿠커" class="w-16 h-16 object-contain" />
        </div>
        <span class="card-label font-black text-slate-700 text-xs sm:text-sm">슬로우쿠커</span>
      </div>

      <!-- 블렌더 -->
      <div onclick="toggleCard(this)" class="duo-card cursor-pointer relative flex flex-col items-center justify-between p-3.5 bg-white rounded-2xl border-2 border-b-[5px] border-slate-200">
        <div class="w-20 h-20 flex items-center justify-center mb-1">
          <img src="./blender.png" alt="블렌더" class="w-16 h-16 object-contain" />
        </div>
        <span class="card-label font-black text-slate-700 text-xs sm:text-sm">블렌더</span>
      </div>

      <!-- 기타 조리도구 -->
      <div onclick="toggleCard(this)" class="duo-card col-span-2 cursor-pointer relative flex flex-col items-center justify-between p-3.5 bg-white rounded-2xl border-2 border-b-[5px] border-slate-200">
        <div class="w-20 h-20 flex items-center justify-center mb-1">
          <img src="./other_utensils.png" alt="기타 조리도구" class="w-16 h-16 object-contain" />
        </div>
        <span class="card-label font-black text-slate-700 text-xs sm:text-sm">기타 조리도구</span>
      </div>

    </div>

    <!-- Action Button -->
    <button class="duo-btn w-full py-4 bg-green-500 text-white font-black rounded-2xl tracking-wider uppercase text-lg transition-all">
      선택 완료
    </button>
  </div>

  <script>
    function toggleCard(el) {
      el.classList.toggle("selected");
    }

    function changeMoldColor(colorHex, btn) {
      document.querySelectorAll(".color-dot").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");

      const moldIds = ["mold_1slot_img", "mold_4slot_img", "mold_6slot_img", "mold_15slot_img", "mold_custom_img"];
      moldIds.forEach(id => {
        const el = document.getElementById(id);
        if (el) {
          el.style.color = colorHex;
        }
      });
    }
  </script>
</body>
</html>
