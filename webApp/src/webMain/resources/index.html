<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BlockByBlock - 스마트한 푸드 블럭 관리</title>
    
    <!-- Preload Korean TTF Font & Splash Food Block Images -->
    <link rel="preload" href="./composeResources/blockbyblock.shared.generated.resources/font/notosans_kr_regular.ttf" as="fetch" type="font/ttf" crossorigin="anonymous">
    <link rel="preload" href="./composeResources/blockbyblock.shared.generated.resources/drawable/food_block_top_2x4_green.png" as="image" type="image/png">
    <link rel="preload" href="./composeResources/blockbyblock.shared.generated.resources/drawable/food_block_top_2x4_yellow.png" as="image" type="image/png">
    <link rel="preload" href="./composeResources/blockbyblock.shared.generated.resources/drawable/food_block_top_2x4_red.png" as="image" type="image/png">
    
    <link type="text/css" rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- 📱 Compose Multiplatform Root Container -->
    <div id="composeApp" style="width: 100%; height: 100%; position: absolute; top: 0; left: 0;"></div>

    <!-- 🧱 Smart Loading Splash Screen (Fixed Overlay, Warm Palette & Bottom Nav) -->
    <div id="splash-screen">
        <div class="splash-center">
            <div class="splash-card">
                <!-- 🌿🧀🥩 Food Block Top View Assembly -->
                <div class="food-assembly-track">
                    <img class="food-brick-img brick-green" src="./composeResources/blockbyblock.shared.generated.resources/drawable/food_block_top_2x4_green.png" alt="채소 푸드 블록" />
                    <img class="food-brick-img brick-yellow" src="./composeResources/blockbyblock.shared.generated.resources/drawable/food_block_top_2x4_yellow.png" alt="곡류 푸드 블록" />
                    <img class="food-brick-img brick-red" src="./composeResources/blockbyblock.shared.generated.resources/drawable/food_block_top_2x4_red.png" alt="육류 푸드 블록" />
                </div>

                <h1 class="splash-title">BlockByBlock</h1>
                <p class="splash-loading-text" id="splash-loading-text">식재료 목록 로딩 중<span class="dots">...</span></p>
            </div>
        </div>

        <!-- 📱 Bottom Navigation Bar during Splash (Seamless Transition with AppBottomNav) -->
        <div class="splash-bottom-nav">
            <div class="splash-nav-item active">
                <svg viewBox="0 0 24 24"><path d="M19 3h-1V1h-2v2H8V1H6v2H5c-1.11 0-1.99.9-1.99 2L3 19c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V8h14v11zM7 10h5v5H7z"/></svg>
                <span>식단</span>
            </div>
            <div class="splash-nav-item">
                <svg viewBox="0 0 24 24"><path d="M13 13v8h8v-8h-8zM3 21h8v-8H3v8zM3 3v8h8V3H3zm13.66-1.31L11 7.34 16.66 13l5.66-5.66-5.66-5.65z"/></svg>
                <span>블록</span>
            </div>
            <div class="splash-nav-item">
                <svg viewBox="0 0 24 24"><path d="M7 18c-1.1 0-1.99.9-1.99 2S5.9 22 7 22s2-.9 2-2-.9-2-2-2zM1 2v2h2l3.6 7.59-1.35 2.45c-.16.28-.25.61-.25.96 0 1.1.9 2 2 2h12v-2H7.42c-.14 0-.25-.11-.25-.25l.03-.12.9-1.63h7.45c.75 0 1.41-.41 1.75-1.03l3.58-6.49c.08-.14.12-.31.12-.48 0-.55-.45-1-1-1H5.21l-.94-2H1zm16 16c-1.1 0-1.99.9-1.99 2s.89 2 1.99 2 2-.9 2-2-.9-2-2-2z"/></svg>
                <span>보관함</span>
            </div>
            <div class="splash-nav-item">
                <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
                <span>MY</span>
            </div>
        </div>
    </div>

    <script>
        var LOADING_MESSAGES = {
            ko: [
                "장바구니 목록 생각 중..",
                "밀프렙 레시피 고민 중..",
                "블록 해동 중..",
                "냉장고를 블록으로 바꾸는 중..",
                "재료를 블록으로 만드는 중..",
                "오늘 먹을 블록 고르는 중..",
                "맛있는 블록 조합 찾는 중.."
            ],
            en: [
                "Thinking about the shopping list..",
                "Brainstorming meal prep recipes..",
                "Defrosting food blocks..",
                "Turning the fridge into blocks..",
                "Making ingredients into blocks..",
                "Picking today's food blocks..",
                "Finding delicious block combos.."
            ]
        };

        (function() {
            var splash = document.getElementById('splash-screen');
            var loadingTextEl = document.getElementById('splash-loading-text');
            var isHidden = false;

            var savedLang = localStorage.getItem('blockbyblock_language');
            var userLang = (savedLang || navigator.language || '').toLowerCase().startsWith('ko') ? 'ko' : 'en';
            var list = LOADING_MESSAGES[userLang] || LOADING_MESSAGES.ko;

            if (loadingTextEl && list && list.length > 0) {
                var randomIndex = Math.floor(Math.random() * list.length);
                loadingTextEl.innerHTML = list[randomIndex] + '<span class="dots">...</span>';
            }

            function hideSplash() {
                if (isHidden || !splash) return;
                isHidden = true;

                splash.classList.add('fade-out');
                setTimeout(function() {
                    if (splash && splash.parentNode) {
                        splash.parentNode.removeChild(splash);
                    }
                }, 150);
            }

            window.__hideSplash = hideSplash;
            setTimeout(hideSplash, 6000);
        })();
    </script>
    <script type="application/javascript" src="webApp.js"></script>
</body>
</html>
